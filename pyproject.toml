[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = 'REDCapUtilities'
version='1.4.4'
license= {file = 'LICENSE'}
readme = "README.md"
authors = [
    {name = "Kevin J. Delaney", email = "<kjdelaney@health.ucsd.edu>"},
]
description='Allows code reuse by other Python projects.'
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.7",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[tool.black]
target-version = ["py311"]
include = '\.pyi?$'

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    'if TYPE_CHECKING:',
    'pragma: no cover'
]

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.mypy]
disallow_any_unimported = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true
show_error_codes = true
ignore_missing_imports = true
disable_error_code = ["call-arg", "call-overload", "var-annotated"]

[tool.poetry]
name = "REDCapUtilities"
package-mode = false

[[tool.poetry.packages]]
include = "redcaputilities"

[project.urls]
documentation = "https://github.com/DBMI/REDCapUtilities"
homepage = "https://github.com/DBMI/REDCapUtilities"
repository = "https://github.com/DBMI/REDCapUtilities"

[tool.poetry.dependencies]
numpy = '>=2.4.2'
python = ">=3.11, <4.0"
pandas = ">=1.3.5"
python-dateutil = "^2.8.2"
pyyaml = "^6.0.1"
requests = ">=2.31.0"

[tool.poetry.group.dev.dependencies]
autoflake = "*"
black = "*"
flake8 = "*"
flake8-bugbear = "*"
flake8-builtins = "*"
flake8-comprehensions = "*"
flake8-debugger = "*"
flake8-eradicate = "*"
flake8-logging = "*"
isort = "*"
make = "*"
mkdocs = "*"
mkdocstrings = "*"
mkdocs-material = "*"
mypy = "*"
openpyxl = "*"
pep8-naming = "*"
pre-commit = "*"
pymdown-extensions = "*"
pytest = "*"
pytest-github-actions-annotate-failures = "*"
pytest-cov = "*"
python-kacl = "*"
pyupgrade = "*"
setuptools = "*"
tryceratops = "*"
typing = "*"
usaddress = "*"
wheel = "*"

[tool.pylint.format]
max-line-length="88"

[tool.pytest.ini_options]
addopts = """\
    --cov-report term-missing \
    --no-cov-on-fail \
"""
pythonpath = [".", "src"]
testpaths = ["redcaputilities"]
